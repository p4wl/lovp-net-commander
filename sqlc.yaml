version: "2"
sql:
  - engine: "postgresql"
    schema: "./migrations/"
    queries: "./subnets.sql"
    gen:
      go:
        package: "repository"
        out: "internal/repository"
        sql_package: "pgx/v5"
        emit_json_tags: true
        overrides:
          - db_type: "cidr"
            go_type: "net.IPNet"
          - db_type: "int4"
            go_type: "int32"
